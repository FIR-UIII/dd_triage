<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DD Triage — Загрузка ID</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body>
<div class="container py-5" style="max-width:660px">
  <div class="card shadow">
    <div class="card-header py-3">
      <h5 class="mb-0">DefectDojo Triage</h5>
    </div>
    <div class="card-body">
      {% if error %}
        <div class="alert alert-danger mb-3">{{ error }}</div>
      {% endif %}

      <!-- Tabs -->
      <ul class="nav nav-tabs mb-3" id="inputTabs">
        <li class="nav-item">
          <button class="nav-link {% if active_tab != 'upload' %}active{% endif %}"
                  data-tab-target="#tab-ids" type="button">
            По ID
          </button>
        </li>
        <li class="nav-item">
          <button class="nav-link {% if active_tab == 'upload' %}active{% endif %}"
                  data-tab-target="#tab-upload" type="button">
            Загрузить JSONL
          </button>
        </li>
      </ul>

      <div class="tab-content">

        <!-- Tab 1: IDs -->
        <div class="tab-pane fade {% if active_tab != 'upload' %}show active{% endif %}" id="tab-ids">
          <form method="POST" action="/">
            <div class="mb-3">
              <label for="finding_ids" class="form-label">
                Вставьте ID сработок (каждый на новой строке):
              </label>
              <textarea
                id="finding_ids"
                name="finding_ids"
                class="form-control font-monospace"
                rows="12"
                placeholder="111111&#10;222222&#10;333333"
                autofocus
              ></textarea>
              <div class="form-text mt-1">
                Только числовые ID; пустые строки и пробелы игнорируются.
              </div>
            </div>
            <div class="d-grid">
              <button type="submit" class="btn btn-primary" id="btn-ids">
                Загрузить сработки &rarr;
              </button>
            </div>
          </form>
        </div>

        <!-- Tab 2: JSONL upload -->
        <div class="tab-pane fade {% if active_tab == 'upload' %}show active{% endif %}" id="tab-upload">
          <form method="POST" action="/upload" enctype="multipart/form-data" id="upload-form">
            <div class="mb-3">
              <label class="form-label">Файл результатов триажа (.jsonl):</label>
              <div class="upload-zone" id="upload-zone">
                <input type="file" name="jsonl_file" id="jsonl_file" accept=".jsonl,.json">
                <div class="upload-icon">&#8679;</div>
                <div class="text-secondary" style="font-size:.9rem">Нажмите или перетащите файл .jsonl</div>
                <div class="file-name" id="file-name"></div>
              </div>
              <div class="form-text mt-1">
                Каждая строка — JSON-объект сработки с полем <code>triage_result</code>.
              </div>
            </div>
            <div class="d-grid">
              <button type="submit" class="btn btn-primary" id="btn-upload" disabled>
                Обработать файл &rarr;
              </button>
            </div>
          </form>
        </div>

      </div><!-- /tab-content -->
    </div>
  </div>
</div>

<script src="{{ url_for('static', filename='js/index.js') }}"></script>
</body>
</html>
