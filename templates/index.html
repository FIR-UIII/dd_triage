<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DD Triage — Загрузка ID</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <style>
    body { background: #0d1117; color: #c9d1d9; }
    .card { background: #161b22; border: 1px solid #30363d; }
    .card-header { background: #21262d; border-bottom: 1px solid #30363d; }
    .form-control, .form-control:focus {
      background: #0d1117; color: #c9d1d9;
      border-color: #30363d;
    }
    .form-control::placeholder { color: #6e7681; }
    .btn-primary { background: #238636; border-color: #2ea043; }
    .btn-primary:hover { background: #2ea043; border-color: #3fb950; }
    .nav-tabs { border-bottom-color: #30363d; }
    .nav-tabs .nav-link { color: #8b949e; border-color: transparent; }
    .nav-tabs .nav-link:hover { color: #c9d1d9; border-color: transparent; }
    .nav-tabs .nav-link.active { background: #161b22; color: #c9d1d9; border-color: #30363d #30363d #161b22; }
    .upload-zone { border: 2px dashed #30363d; border-radius: 8px; padding: 2rem; text-align: center; cursor: pointer; transition: border-color .2s; }
    .upload-zone:hover, .upload-zone.drag { border-color: #58a6ff; }
    .upload-zone input[type=file] { display: none; }
    .file-name { font-size: .85rem; color: #58a6ff; margin-top: .5rem; min-height: 1.2em; }
  </style>
</head>
<body>
<div class="container py-5" style="max-width:640px">
  <div class="card shadow">
    <div class="card-header py-3">
      <h5 class="mb-0">DefectDojo Triage</h5>
    </div>
    <div class="card-body">
      {% if error %}
        <div class="alert alert-danger py-2">{{ error }}</div>
      {% endif %}

      <!-- Tabs -->
      <ul class="nav nav-tabs mb-3" id="inputTabs">
        <li class="nav-item">
          <button class="nav-link {% if active_tab != 'upload' %}active{% endif %}"
                  data-bs-toggle="tab" data-bs-target="#tab-ids" type="button">
            По ID
          </button>
        </li>
        <li class="nav-item">
          <button class="nav-link {% if active_tab == 'upload' %}active{% endif %}"
                  data-bs-toggle="tab" data-bs-target="#tab-upload" type="button">
            Загрузить JSONL
          </button>
        </li>
      </ul>

      <div class="tab-content">

        <!-- Tab 1: IDs -->
        <div class="tab-pane fade {% if active_tab != 'upload' %}show active{% endif %}" id="tab-ids">
          <form method="POST" action="/">
            <div class="mb-3">
              <label for="finding_ids" class="form-label text-secondary">
                Вставьте ID сработок (каждый на новой строке):
              </label>
              <textarea
                id="finding_ids"
                name="finding_ids"
                class="form-control font-monospace"
                rows="12"
                placeholder="111111&#10;222222&#10;333333"
                autofocus
              ></textarea>
              <div class="form-text text-secondary mt-1">
                Только числовые ID; пустые строки и пробелы игнорируются.
              </div>
            </div>
            <div class="d-grid">
              <button type="submit" class="btn btn-primary" id="btn-ids">
                Загрузить сработки &rarr;
              </button>
            </div>
          </form>
        </div>

        <!-- Tab 2: JSONL upload -->
        <div class="tab-pane fade {% if active_tab == 'upload' %}show active{% endif %}" id="tab-upload">
          <form method="POST" action="/upload" enctype="multipart/form-data" id="upload-form">
            <div class="mb-3">
              <label class="form-label text-secondary">Файл результатов триажа (.jsonl):</label>
              <div class="upload-zone" id="upload-zone" onclick="document.getElementById('jsonl_file').click()">
                <input type="file" name="jsonl_file" id="jsonl_file" accept=".jsonl,.json">
                <div style="font-size:2rem;color:#30363d">&#8679;</div>
                <div class="text-secondary" style="font-size:.9rem">Нажмите или перетащите файл .jsonl</div>
                <div class="file-name" id="file-name"></div>
              </div>
              <div class="form-text text-secondary mt-1">
                Каждая строка — JSON-объект сработки с полем <code>triage_result</code>.
              </div>
            </div>
            <div class="d-grid">
              <button type="submit" class="btn btn-primary" id="btn-upload" disabled>
                Обработать файл &rarr;
              </button>
            </div>
          </form>
        </div>

      </div><!-- /tab-content -->
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
// Live counter for IDs tab
const ta = document.getElementById('finding_ids');
const btnIds = document.getElementById('btn-ids');
ta.addEventListener('input', () => {
  const ids = ta.value.split('\n').filter(l => l.trim().match(/^\d+$/));
  btnIds.textContent = ids.length
    ? `Загрузить ${ids.length} сработок →`
    : 'Загрузить сработки →';
});

// File upload tab
const fileInput = document.getElementById('jsonl_file');
const fileName = document.getElementById('file-name');
const btnUpload = document.getElementById('btn-upload');
const uploadZone = document.getElementById('upload-zone');

fileInput.addEventListener('change', () => {
  if (fileInput.files.length) {
    fileName.textContent = fileInput.files[0].name;
    btnUpload.disabled = false;
  }
});

uploadZone.addEventListener('dragover', e => { e.preventDefault(); uploadZone.classList.add('drag'); });
uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('drag'));
uploadZone.addEventListener('drop', e => {
  e.preventDefault();
  uploadZone.classList.remove('drag');
  const dt = e.dataTransfer;
  if (dt.files.length) {
    fileInput.files = dt.files;
    fileName.textContent = dt.files[0].name;
    btnUpload.disabled = false;
  }
});
</script>
</body>
</html>
